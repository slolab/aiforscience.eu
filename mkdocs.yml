site_name: AI for Science
site_url: https://aiforscience.eu
site_description: >-
  A living record of best practices for applying agentic AI to science.
repo_url: https://github.com/slolab/aiforscience.eu
repo_name: slolab/aiforscience.eu
edit_uri: edit/main/docs/

# Individual library entries are reached from the Library overview page, not
# the nav, so they do not bloat the sidebar. Keep them out of the not-in-nav
# report.
not_in_nav: |
  /index.md
  /for-decision-makers/index.md
  /library/*-*.md

# Watch the theme overrides too, so `mkdocs serve` hot-reloads edits to
# header/footer and other templates, not only docs and mkdocs.yml.
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/logo.svg
  favicon: assets/img/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    # No navigation.sections: top-level sections are collapsible. Best Practices
    # is forced open on desktop in home.css so the practices always show, while
    # Background and About stay collapsed.
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - tags

# Render each best-practice title from its frontmatter `title` (the overview
# list and each page's H1), so the title is spelled once, in the BP file.
hooks:
  - hooks/bp_pages.py
  - hooks/provenance.py
  - hooks/glossary_terms.py
  # Emit llms.txt, llms-full.txt and per-page .md mirrors. Last, so it captures
  # the same Markdown the pages render from (BP titles already substituted).
  - hooks/llms_txt.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

extra_css:
  - assets/css/palette.css
  - assets/css/home.css
  - assets/css/provenance.css
  - assets/css/glossary.css
  - assets/css/ai-cta.css

extra_javascript:
  - assets/js/provenance.js
  - assets/js/ai_cta.js
  - assets/js/card_spotlight.js
  - assets/js/card_landscape.js

nav:
  - Best Practices:
      # BP page labels come from each page's frontmatter `nav_title`
      # (applied by hooks/bp_pages.py); only ordering lives here.
      - best-practices/01-match-method-to-task.md
      - best-practices/02-default-to-agent-accessibility.md
      - best-practices/03-register-and-vet-interfaces.md
      - best-practices/04-govern-autonomy-and-accountability.md
      - best-practices/05-documentation-and-data-for-agents.md
      - best-practices/06-design-around-user-tasks.md
      - best-practices/07-provenance-and-citation.md
      - best-practices/08-evaluate-tools-before-trust.md
      - best-practices/09-human-in-the-loop.md
      - best-practices/10-screen-dual-use-high-consequence.md
      - "Failures log": best-practices/failures.md
  - Background:
      - Library: library/index.md
      - Glossary: glossary.md
      - Releases: releases/index.md
      - Tags: tags.md
  - About:
      - Mission: about/mission.md
      - How the record works: about/how-the-record-works.md
      - Partners: about/partners.md
      - Governance: about/governance.md
      - Events: about/events.md
      - Contribute: about/contribute.md
      - Become an editor: about/editors.md
      - Code of conduct: about/code-of-conduct.md

copyright: >-
  © 2026 AI for Science contributors. Content licensed
  <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY-4.0</a>.
