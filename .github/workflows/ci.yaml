name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Check provenance integrity
        run: uv run python scripts/check_provenance.py

      - name: Strict build
        run: uv run mkdocs build --strict

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,303,307,308,403,429
            --root-dir ${{ github.workspace }}/site
            --exclude 'https://aiforscience\.eu'
            'site/**/*.html'
          fail: true
