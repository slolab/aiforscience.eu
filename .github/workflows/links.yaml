name: Links

# External link rot is time-driven, not diff-driven: a source URL does not
# break because of a PR. Internal links are already validated by the strict
# build in ci.yaml on every PR. So the outbound link check runs on a schedule
# and after merges, not on the PR critical path, and caches results between
# runs so unchanged URLs are not re-fetched every time.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Build
        run: uv run mkdocs build --strict

      - name: Restore link-check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      # The accepted status codes include some that are not plain 200s but do
      # not indicate rot: 403 and 429 are bot mitigation, and 202 is what
      # EUR-Lex returns for every one of its URL forms (ELI, OJ, CELEX) when
      # fetched by a client it does not recognise as a browser.
      #
      # The theme puts an "edit this page" link on every page, so the built
      # site carries one github.com URL per page, 87 of them at present. Checked
      # in one burst they trip GitHub's rate limiting, which answers with
      # retry-after 300. lychee caps that to 60s and retries, and most of its
      # workers spend the run asleep. Unrelated hosts queued behind that backlog
      # ran past the request timeout and were reported as rot. Excluding the
      # edit links costs no coverage: they are generated from the page being
      # rendered, so they cannot go stale on their own, and the repository URL
      # they all share is still checked. It took the check from 3m25s to 3s.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 3d
            --timeout 30
            --accept 200,201,202,204,206,301,302,303,307,308,403,429
            --root-dir ${{ github.workspace }}/site
            --exclude 'https://aiforscience\.eu'
            --exclude 'https://github\.com/slolab/aiforscience\.eu/edit/'
            'site/**/*.html'
          fail: true
