{#-
  giscus comments, rendered on pages with `comments: true` front matter.
  Threads live in the repo's Discussions under the "Practice page comments"
  category, one per page, mapped by pathname. Configuration generated at
  https://giscus.app.
-#}
{% if page.meta.comments %}
  <h2 id="__comments">Discussion</h2>
  <script
    src="https://giscus.app/client.js"
    data-repo="slolab/aiforscience.eu"
    data-repo-id="R_kgDOTjP0Lw"
    data-category="Practice page comments"
    data-category-id="DIC_kwDOTjP0L84DB8eU"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="preferred_color_scheme"
    data-lang="en"
    crossorigin="anonymous"
    async
  ></script>
{% endif %}
