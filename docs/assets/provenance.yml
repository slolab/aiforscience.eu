# Provenance data for the best practices.
#
# The atom-level for/against graph. Keyed by practice-atom id (bp<N>-a<k>, where
# k is the reading order of the atom in that practice's `## Practice` list). Each
# atom lists the sources that bear on it:
#   - ref:     a reference-work `ref_id` (docs/library/ref-<ref>.md) or a
#              distilled-source page slug (docs/library/<ref>.md)
#   - stance:  supports | qualifies | contradicts
#   - locator: optional, where in the source
#   - quote:   optional, the checkable passage
#
# This is the single source of truth for which sources bear on which practice
# line. A future hover reads it. Update it when an atom is added, split,
# reworded, or removed (ids are stable handles, not tied to wording).
#
# Every atom id here exists on its page as `{ #bp<N>-a<k> }` on the atom.
# A few reference works ground a practice through its Examples rather than a
# Practice atom (for example ietf-aipref on BP03 traffic management); those have a
# library entry but no atom edge here.

# ------------------------------------------------------------------ BP01
bp1-a1:  # method fit; an agent or frontier model is one option, not the default
  - ref: anthropic-building-effective-agents-2024
    stance: supports
    locator: "find the simplest solution; increase complexity only when needed"
    quote: "we recommend finding the simplest solution possible, and only increasing complexity when needed"
  - ref: jrc-ai-in-science-2025
    stance: supports
    locator: "AI as a tool in science"
  - ref: mit-genai-divide-2025
    stance: supports
    locator: "§4.3, pg. 13"
    quote: "AI has already won the war for simple work ... But for anything complex or long-term, humans dominate by 9-to-1 margins. The dividing line isn't intelligence, it's memory, adaptability, and learning capability"
  - ref: expectation-realisation-gap-2026
    stance: supports
    locator: "Heterogeneity as the default"
    quote: "there is currently no stable, globally positive treatment effect for agentic AI. Average headline figures ... will systematically misrepresent the benefit realised by any specific user, team, or organisation"
bp1-a2:  # for well-defined work, a deterministic or specialized method often fits better
  - ref: kapoor-agents-that-matter-2024
    stance: supports
    locator: "cost-controlled evaluation; complex agents do not beat simple baselines"
    quote: "SOTA agents are needlessly complex and costly"
  - ref: mit-genai-divide-2025
    stance: supports
    locator: "Executive Summary, pg. 3"
    quote: "This divide does not seem to be driven by model quality or regulation, but seems to be determined by approach"
  - ref: bucher-fine-tuned-2024
    stance: supports
    locator: "fine-tuned smaller models beat zero-shot frontier models"
    quote: "smaller, fine-tuned LLMs (still) consistently and significantly outperform larger, zero-shot prompted models in text classification"
  - ref: ec-expert-forum-2026
    stance: supports
    locator: "§3.2.3, p. 21; §3.2.2, p. 20"
    quote: "tools of this type ... can outperform general-purpose models within their domains while requiring substantially less capital and compute to develop"
  - ref: ec-expert-forum-2026
    stance: qualifies
    locator: "§3.2.2, p. 20; ch. 4, p. 22"
    quote: "non-frontier access is an imperfect substitute for frontier access"
bp1-a3:  # agentic autonomy earns its cost only when flexibility at scale is needed
  - ref: anthropic-building-effective-agents-2024
    stance: supports
    locator: "workflows for well-defined tasks; agents when flexibility needed at scale"
    quote: "Agentic systems often trade latency and cost for better task performance"
  - ref: expectation-realisation-gap-2026
    stance: supports
    locator: "software engineering copilots; METR RCT"
    quote: "the net slowdown occurred because the time spent reviewing, debugging, and integrating AI-generated code exceeded the time saved in initial generation"
bp1-a4:  # frontier model where a specialized method fits -> avoidable failure modes
